plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.4.20'
}

def composeTraceLabDir = providers.gradleProperty('composeTraceLabDir').orElse('../compose-tracing-demo').get()
def composeTraceLabRoot = new File(composeTraceLabDir)
if (!composeTraceLabRoot.isAbsolute()) composeTraceLabRoot = rootProject.file(composeTraceLabRoot)
def demo = new File(composeTraceLabRoot, 'app')

android {
    namespace = "dev.demo.uitracing"
    compileSdk { version = release(37) { minorApiLevel = 1 } }
    defaultConfig {
        applicationId = 'dev.demo.uitracing'
        minSdk { version = release(26) }
        targetSdk { version = release(35) }
        versionCode = 1
        versionName = '1.0'
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildFeatures { compose true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets {
        main {
            manifest.srcFile new File(demo, 'src/main/AndroidManifest.xml')
            kotlin.srcDirs = [new File(demo, 'src/main/java')]
            res.srcDirs = [new File(demo, 'src/main/res')]
        }
        androidTest.kotlin.srcDirs = [new File(demo, 'src/androidTest/java')]
    }
    testOptions { animationsDisabled true }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation project(':compose:runtime:runtime')
    implementation project(':compose:ui:ui')
    implementation files(new File(demo, 'libs/ui-tracing-perfetto.aar'))
    implementation project(':compose:animation:animation-core')
    implementation project(':compose:foundation:foundation')
    implementation 'androidx.compose.material3:material3:1.3.1'
    implementation 'androidx.activity:activity-compose:1.10.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation files(new File(demo, 'libs/perfetto-datasource.aar'))
    debugImplementation 'androidx.compose.ui:ui-tooling:1.7.6'
    debugImplementation 'androidx.compose.ui:ui-test-manifest:1.7.6'
    androidTestImplementation platform('androidx.compose:compose-bom:2024.12.01')
    androidTestImplementation project(':compose:runtime:runtime')
    androidTestImplementation project(':compose:ui:ui')
    androidTestImplementation project(':compose:animation:animation-core')
    androidTestImplementation project(':compose:foundation:foundation')
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4:1.7.6'
}
